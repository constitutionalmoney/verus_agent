name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: |
            requirements.build.lock
            requirements.test.lock
      - name: Install locked test dependencies and package
        run: |
          python -m pip install --require-hashes -r requirements.build.lock
          python -m pip install --require-hashes -r requirements.test.lock
          python -m pip install --no-build-isolation --no-deps .
      - name: Public-content boundary
        run: python scripts/check_public_content.py
      - name: Mock-based unit and integration tests
        run: pytest tests/ -m "not upstream_contract"
      - name: Upstream source contract
        run: |
          git clone --depth 1 https://github.com/VerusCoin/verus-typescript-primitives.git verus-typescript-primitives
          pytest -m upstream_contract
      - name: Build wheel
        run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .
      - name: Build standalone runtime image
        run: docker build --tag verus-agent:test .
