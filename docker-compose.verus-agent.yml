services:
  verus-agent:
    image: python:3.11.16-slim-bookworm@sha256:0bee7276f83efd4a1ee05bbbf4281d95ed28e079220a9457f25a93e3f1e3c31b
    container_name: verus_agent_standalone
    working_dir: /workspace
    volumes:
      - ./:/workspace/verus_agent
      - verus-agent-runtime:/runtime
    ports:
      - "${VERUS_AGENT_HEALTH_PORT:-9124}:9124"
    environment:
      VERUS_NETWORK: ${VERUS_NETWORK:-testnet}
      VERUS_API_URL: ${VERUS_API_URL:-https://api.verustest.net}
      VERUS_UAI_INTEGRATION_ENABLED: ${VERUS_UAI_INTEGRATION_ENABLED:-false}
      VERUS_SECURITY_LEVEL: ${VERUS_SECURITY_LEVEL:-disabled}
      VERUS_MARKETPLACE_ENABLED: ${VERUS_MARKETPLACE_ENABLED:-false}
      VERUS_IP_PROTECTION_ENABLED: ${VERUS_IP_PROTECTION_ENABLED:-false}
      VERUS_MCP_ENABLED: ${VERUS_MCP_ENABLED:-false}
      VERUS_ACTIVATION_PROFILE_PATH: ${VERUS_ACTIVATION_PROFILE_PATH:-}
      VERUS_MUTATION_APPROVAL_PATH: ${VERUS_MUTATION_APPROVAL_PATH:-}
      VERUS_MUTATION_OUTBOX_PATH: ${VERUS_MUTATION_OUTBOX_PATH:-/runtime/mutation.outbox.sqlite}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command:
      - sh
      - -lc
      - >
          pip install --no-cache-dir --require-hashes -r verus_agent/requirements.runtime.lock &&
          python -m verus_agent.agent

volumes:
  verus-agent-runtime:
